<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Accounting System{% endblock %}</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --green:#4ade80; --red:#f87171; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 40px; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 36px; background: #0b1220; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .nav a { color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: 600; }
  .nav a:hover { background: var(--card); color: var(--text); }
  .nav a.active { background: var(--accent); color: #082f49; }
  .content { padding: 32px 36px; max-width: 1200px; }
  h1 { font-size: 26px; }
  h2 { font-size: 16px; font-weight: 600; margin: 0 0 10px; color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 26px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; }
  .card .num { font-size: 30px; font-weight: 700; color: var(--accent); }
  .card .label { color: var(--muted); font-size: 13px; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 24px; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; background: rgba(255,255,255,.02); }
  tr:last-child td { border-bottom: none; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .asset, .expense { background: #1d4ed8; color: #dbeafe; }
  .liability, .equity, .revenue { background: #15803d; color: #dcfce7; }
  .debit { color: #93c5fd; }
  .credit { color: #86efac; }
  .balanced { color: var(--green); font-weight: 600; margin: 0 0 24px; }
  .unbalanced { color: var(--red); font-weight: 600; margin: 0 0 24px; }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 4px; }
  .form-row input, .form-row select { width: 100%; max-width: 380px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #0b1220; color: var(--text); font-size: 14px; }
  .btn { display: inline-block; padding: 11px 20px; border-radius: 8px; border: none; background: var(--accent); color: #082f49; font-weight: 700; cursor: pointer; font-size: 14px; }
  .btn:hover { filter: brightness(1.1); }
  .errors, .errorlist { color: var(--red); font-size: 13px; }
  .errors { margin: 10px 0; }
  .errorlist { list-style: none; margin-top: 4px; }
  .formset-table input, .formset-table select { width: 100%; }
  .filterbar { display: flex; gap: 10px; align-items: end; margin-bottom: 22px; flex-wrap: wrap; }
  .filterbar .form-row { margin-bottom: 0; }
  .filterbar input { max-width: 180px; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
  <nav class="nav">
    <a href="/" class="{% if request.path == '/' %}active{% endif %}">Dashboard</a>
    <a href="/invoices/new/" class="{% if request.path == '/invoices/new/' %}active{% endif %}">New Invoice</a>
    <a href="/payments/new/" class="{% if request.path == '/payments/new/' %}active{% endif %}">Record Payment</a>
    <a href="/reports/profit-and-loss/" class="{% if request.path == '/reports/profit-and-loss/' %}active{% endif %}">Profit &amp; Loss</a>
    <a href="/reports/balance-sheet/" class="{% if request.path == '/reports/balance-sheet/' %}active{% endif %}">Balance Sheet</a>
    <a href="/reports/cash-flow/" class="{% if request.path == '/reports/cash-flow/' %}active{% endif %}">Cash Flow</a>
    <a href="/reports/aged-receivables/" class="{% if request.path == '/reports/aged-receivables/' %}active{% endif %}">AR Aging</a>
    <a href="/reports/aged-payables/" class="{% if request.path == '/reports/aged-payables/' %}active{% endif %}">AP Aging</a>
    <a href="/reports/vat-return/" class="{% if request.path == '/reports/vat-return/' %}active{% endif %}">VAT</a>
    <a href="/reports/budget-variance/" class="{% if request.path == '/reports/budget-variance/' %}active{% endif %}">Budgets</a>
    <a href="/reports/general-ledger/" class="{% if request.path == '/reports/general-ledger/' %}active{% endif %}">Ledger</a>
    <a href="/reports/account-ledger/" class="{% if request.path == '/reports/account-ledger/' %}active{% endif %}">Account</a>
    <a href="/reports/party-statement/" class="{% if request.path == '/reports/party-statement/' %}active{% endif %}">Party</a>
    <a href="/reports/financial-ratios/" class="{% if request.path == '/reports/financial-ratios/' %}active{% endif %}">Ratios</a>
    <a href="/admin/">Admin</a>
  </nav>
  <div class="content">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
